<!doctype html>
<html lang="en">
  <body
    style="margin: 0; padding: 0; background: #f6f7f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f6f7f9; padding: 32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 460px; background: #ffffff; border-radius: 16px; padding: 32px">
            <tr>
              <td>
                <h1 style="margin: 0 0 8px; font-size: 20px; color: #14181f">Your Sangath code</h1>
                <p style="margin: 0 0 24px; font-size: 14px; line-height: 22px; color: #5a6472">
                  Enter this code in the app to continue. It expires in 10 minutes.
                </p>

                <div style="text-align: center; margin: 0 0 24px">
                  <span style="display: inline-block; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #14181f; background: #f2f4f7; border-radius: 12px; padding: 16px 24px">
                    {{ .Token }}
                  </span>
                </div>

                <p style="margin: 0; font-size: 13px; line-height: 20px; color: #8a94a3">
                  If you didn't request this code, you can safely ignore this email — someone may have
                  typed your address by mistake. Never share this code with anyone.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0; font-size: 12px; color: #98a2b3">Sangath — community &amp; family</p>
        </td>
      </tr>
    </table>
  </body>
</html>
