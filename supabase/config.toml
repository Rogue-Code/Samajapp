project_id = "meafejswzmogeqocgici"

[auth]
site_url = "http://localhost:8080"
# Password-reset links must land somewhere the client can actually open:
# the dev server, the LAN address used when testing from a phone browser,
# and the origin a Capacitor Android build serves itself from.
additional_redirect_urls = [
  "http://localhost:8080",
  # Where `vite preview` serves the built Capacitor bundle, so a magic link can
  # land in a browser running the exact APK build.
  "http://localhost:4173",
  "http://192.168.1.15:8080",
  "https://localhost",
]

[auth.email]
enable_signup = true
enable_confirmations = false
# Signup and login both use a 6-digit emailed code (signInWithOtp + verifyOtp).
otp_length = 6
# 10 minutes: long enough to switch to a mail app and back, short enough that a
# code left sitting in an inbox stops working.
otp_expiry = 600

# Gmail SMTP. The password is read from the environment so it never lands in the
# repo — export SUPABASE_AUTH_SMTP_PASS before running `supabase config push`.
[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 587
user = "sangathsupport@gmail.com"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "sangathsupport@gmail.com"
sender_name = "Sangath"

# The stock templates send only a {{ .ConfirmationURL }} link, which the code entry
# screen has nothing to verify against. These send {{ .Token }} instead.
#
# magic_link is the one that actually fires on this project: enable_confirmations is
# false, so Supabase routes even first-time signups through it (verified — the
# confirmation template has never been used). confirmation is set anyway so the flow
# still works if confirmations are ever turned on.
[auth.email.template.magic_link]
subject = "Your Sangath login code"
content_path = "./supabase/templates/otp_code.html"

[auth.email.template.confirmation]
subject = "Your Sangath verification code"
content_path = "./supabase/templates/otp_code.html"
